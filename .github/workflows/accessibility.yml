name: Accessibility audit
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/accessibility-audit.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessibility-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        apps:
          - portal timetable apparel
          - supporters partners library
          - floor creative admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit the selected apps
        env:
          APPS: ${{ matrix.apps }}
        run: node scripts/accessibility-audit.mjs $APPS
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [accessibility-shard]
    if: ${{ always() }}
    steps:
      - name: Require all accessibility audits
        env:
          AUDIT_RESULT: ${{ needs.accessibility-shard.result }}
        run: test "$AUDIT_RESULT" = success
