name: First screen browser checks
on:
  pull_request:
    paths:
      - 'scripts/browser-smoke.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/first-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm test:browser-smoke
