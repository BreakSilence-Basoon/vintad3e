name: Prototype captures
on: [pull_request]
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: mkdir -p "$RUNNER_TEMP/vintad3e-captures"
      - run: corepack pnpm --filter @vintad3e/apparel-web exec node --test src/local-inventory-browser.test.mjs
        env:
          VINTAD3E_CAPTURE_DIR: ${{ runner.temp }}/vintad3e-captures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inventory-sqlite-captures
          path: ${{ runner.temp }}/vintad3e-captures/*.png
          if-no-files-found: error
          retention-days: 7
