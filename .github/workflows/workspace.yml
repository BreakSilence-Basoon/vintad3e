name: Workspace checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  selection-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Protect founder note and guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && git cat-file -e "${{ github.event.pull_request.base.sha }}:scripts/check-founder-note.mjs" 2>/dev/null; then
            git show "${{ github.event.pull_request.base.sha }}:scripts/check-founder-note.mjs" > "$RUNNER_TEMP/founder-note-guard.mjs"
            node "$RUNNER_TEMP/founder-note-guard.mjs"
          else
            node scripts/check-founder-note.mjs
          fi
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm test
      - run: corepack pnpm --filter @vintad3e/ui test
      - run: corepack pnpm --filter @vintad3e/ui test:lint
      - run: corepack pnpm --filter @vintad3e/timetable-policy test
      - run: corepack pnpm --filter @vintad3e/ledger-facts test
      - run: corepack pnpm --filter @vintad3e/ledger-evidence-vault test
      - run: corepack pnpm --filter @vintad3e/ledger-access test
      - run: corepack pnpm --filter @vintad3e/ledger-store test
      - run: corepack pnpm --filter @vintad3e/ledger-api test
      - run: corepack pnpm --filter @vintad3e/access-token test
      - run: corepack pnpm --filter @vintad3e/oidc-login test
      - run: corepack pnpm --filter @vintad3e/timetable-read-api test
      - run: corepack pnpm --filter @vintad3e/timetable-store test
      - run: corepack pnpm --filter @vintad3e/timetable-api test
      - run: corepack pnpm --filter @vintad3e/timetable-api exec node --test integration/browser-web.test.mjs
      - run: corepack pnpm --filter @vintad3e/timetable-web test
      - run: corepack pnpm --filter @vintad3e/timetable-web test:fixture-browser
      - run: corepack pnpm --filter @vintad3e/timetable-web build
      - run: corepack pnpm --filter @vintad3e/timetable-web exec node --test src/history-view-http.test.mjs
      - run: corepack pnpm --filter @vintad3e/portal-web test
      - run: corepack pnpm --filter @vintad3e/portal-web test:fixture-http
      - run: corepack pnpm --filter @vintad3e/portal-web test:fixture-browser
      - run: corepack pnpm --filter @vintad3e/portal-web build
      - run: corepack pnpm --filter @vintad3e/apparel-web test
      - run: corepack pnpm --filter @vintad3e/apparel-web test:fixture-http
      - run: corepack pnpm --filter @vintad3e/apparel-web build
      - run: corepack pnpm --filter @vintad3e/supporters-web test
      - run: corepack pnpm --filter @vintad3e/supporters-web build
      - run: corepack pnpm --filter @vintad3e/partners-web test
      - run: corepack pnpm --filter @vintad3e/partners-web build
      - run: corepack pnpm --filter @vintad3e/library-web test
      - run: corepack pnpm --filter @vintad3e/library-web build
      - run: corepack pnpm --filter @vintad3e/floor-web test
      - run: corepack pnpm --filter @vintad3e/floor-web build
      - run: corepack pnpm --filter @vintad3e/creative-web test
      - run: corepack pnpm --filter @vintad3e/creative-web test:fixture-http
      - run: corepack pnpm --filter @vintad3e/creative-web test:fixture-browser
      - run: corepack pnpm --filter @vintad3e/creative-web build
      - run: corepack pnpm --filter @vintad3e/admin-web test
      - run: corepack pnpm --filter @vintad3e/admin-web test:fixture-browser
      - run: corepack pnpm --filter @vintad3e/admin-web build
  parallel-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: timetable-web
            command: test:fixture-http
          - app: supporters-web
            command: test:fixture-browser
          - app: floor-web
            command: test:fixture-browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Run fixture tests
        env:
          APP: ${{ matrix.app }}
          COMMAND: ${{ matrix.command }}
        run: corepack pnpm --filter "@vintad3e/$APP" "$COMMAND"
  heavy-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [apparel-web, partners-web, library-web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm --filter @vintad3e/${{ matrix.app }} test:fixture-browser
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [selection-core, heavy-browser, parallel-fixtures]
    if: ${{ always() }}
    steps:
      - name: Require all workspace checks
        env:
          CORE_RESULT: ${{ needs.selection-core.result }}
          BROWSER_RESULT: ${{ needs.heavy-browser.result }}
          FIXTURE_RESULT: ${{ needs.parallel-fixtures.result }}
        run: |
          test "$CORE_RESULT" = success && test "$BROWSER_RESULT" = success && test "$FIXTURE_RESULT" = success
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: apparel-web
            tests: src/shortage-fixture-browser.test.mjs
          - app: supporters-web
            tests: src/sns-fixture-self-browser.test.mjs
          - app: timetable-web
            tests: src/fixture-history-admin-browser.test.mjs src/fixture-schedule-admin-browser.test.mjs src/fixture-self-browser.test.mjs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm --filter @vintad3e/${{ matrix.app }} exec node --test --test-concurrency=1 ${{ matrix.tests }}
